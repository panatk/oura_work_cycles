<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oura Smart Calendar Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            transition: transform 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .card h2 {
            color: #333;
            font-size: 1.2em;
            margin-bottom: 15px;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }

        .stat {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #eee;
        }

        .stat:last-child {
            border-bottom: none;
        }

        .stat-label {
            color: #666;
            font-weight: 500;
        }

        .stat-value {
            color: #667eea;
            font-size: 1.3em;
            font-weight: bold;
        }

        .readiness-bar {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 10px 0;
        }

        .bar {
            flex: 1;
            height: 30px;
            background: linear-gradient(90deg, #ff6b6b 0%, #ffd93d 50%, #6bcf7f 100%);
            border-radius: 6px;
            position: relative;
            overflow: hidden;
        }

        .bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 0.9em;
            transition: width 0.5s ease;
        }

        .day-pattern {
            padding: 8px;
            background: #f5f5f5;
            border-radius: 6px;
            margin: 5px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .day-name {
            font-weight: 600;
            color: #333;
            min-width: 80px;
        }

        .day-bar {
            flex: 1;
            height: 20px;
            background: #e0e0e0;
            border-radius: 4px;
            margin: 0 10px;
            overflow: hidden;
        }

        .day-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            border-radius: 4px;
            transition: width 0.3s ease;
        }

        .day-score {
            font-weight: bold;
            color: #667eea;
            min-width: 40px;
            text-align: right;
        }

        .schedule-container {
            grid-column: 1 / -1;
        }

        .schedule-blocks {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
        }

        .schedule-block {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }

        .block-title {
            font-weight: bold;
            font-size: 1.1em;
            margin-bottom: 8px;
        }

        .block-time {
            font-size: 0.9em;
            opacity: 0.9;
            margin-bottom: 8px;
        }

        .block-type {
            display: inline-block;
            background: rgba(255, 255, 255, 0.2);
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.85em;
            margin-bottom: 8px;
        }

        .block-description {
            font-size: 0.9em;
            opacity: 0.8;
            line-height: 1.4;
        }

        .chronotype-badge {
            display: inline-block;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: bold;
            margin-top: 10px;
        }

        .data-source {
            display: inline-block;
            background: #4caf50;
            color: white;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.9em;
            margin-top: 10px;
        }

        .loading {
            text-align: center;
            color: white;
            font-size: 1.2em;
        }

        .error {
            background: #ff6b6b;
            color: white;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🌟 Oura Smart Calendar Dashboard</h1>
            <p>Your personalized energy & readiness analysis</p>
        </div>

        <div id="content" class="loading">
            Loading your data...
        </div>
    </div>

    <script>
        async function loadDashboard() {
            try {
                const response = await fetch('/status');
                const data = await response.json();

                renderDashboard(data);
            } catch (error) {
                document.getElementById('content').innerHTML = `
                    <div class="error">
                        Error loading dashboard: ${error.message}
                    </div>
                `;
            }
        }

        function renderDashboard(data) {
            const patterns = data.patterns;
            const schedule = data.schedule;

            // Find today's readiness from schedule description
            const readinessMatch = schedule[1]?.description.match(/Readiness: (\d+)/);
            const todayReadiness = readinessMatch ? parseInt(readinessMatch[1]) : 70;

            let html = `
                <div class="grid">
                    <!-- Current Status Card -->
                    <div class="card">
                        <h2>📊 Current Status</h2>
                        <div class="stat">
                            <span class="stat-label">Data Source</span>
                            <span class="data-source">${data.data_source === 'mock' ? '✓ Mock Data' : 'Live API'}</span>
                        </div>
                        <div class="stat">
                            <span class="stat-label">Today's Readiness</span>
                            <span class="stat-value">${todayReadiness}</span>
                        </div>
                        <div class="readiness-bar">
                            <div class="bar">
                                <div class="bar-fill" style="width: ${todayReadiness}%">
                                    ${todayReadiness > 20 ? todayReadiness : ''}
                                </div>
                            </div>
                        </div>
                        <div class="stat">
                            <span class="stat-label">Energy Level</span>
                            <span class="stat-value">${getEnergyLevel(todayReadiness)}</span>
                        </div>
                    </div>

                    <!-- Chronotype Card -->
                    <div class="card">
                        <h2>🕐 Your Chronotype</h2>
                        <div class="stat">
                            <span class="stat-label">Type</span>
                            <span class="stat-value">${patterns.chronotype}</span>
                        </div>
                        <div class="stat">
                            <span class="stat-label">Average Wake Time</span>
                            <span class="stat-value">${patterns.average_wake_time}</span>
                        </div>
                        <div class="stat">
                            <span class="stat-label">Average Bedtime</span>
                            <span class="stat-value">${patterns.average_bedtime}</span>
                        </div>
                        <div class="chronotype-badge">
                            ${getChronotypeMoji(patterns.chronotype)} ${patterns.chronotype.charAt(0).toUpperCase() + patterns.chronotype.slice(1)} Type
                        </div>
                    </div>

                    <!-- Best/Worst Days Card -->
                    <div class="card">
                        <h2>📅 Week Overview</h2>
                        ${Object.entries(patterns.day_of_week_patterns)
                            .sort((a, b) => b[1].average_readiness - a[1].average_readiness)
                            .map(([day, data]) => `
                                <div class="day-pattern">
                                    <span class="day-name">${day}</span>
                                    <div class="day-bar">
                                        <div class="day-bar-fill" style="width: ${data.average_readiness}%"></div>
                                    </div>
                                    <span class="day-score">${data.average_readiness.toFixed(1)}</span>
                                </div>
                            `).join('')}
                    </div>

                    <!-- Today's Schedule -->
                    <div class="card schedule-container">
                        <h2>📋 Today's Personalized Schedule</h2>
                        <p style="color: #999; margin-bottom: 15px; font-size: 0.9em;">
                            ${getScheduleLevel(todayReadiness)} Day
                        </p>
                        <div class="schedule-blocks">
                            ${schedule.map(block => `
                                <div class="schedule-block">
                                    <div class="block-title">${block.title}</div>
                                    <div class="block-time">
                                        ⏰ ${formatTime(block.start)} - ${formatTime(block.end)}
                                    </div>
                                    <div class="block-type">${formatBlockType(block.type)}</div>
                                    <div class="block-description">${block.description}</div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                </div>
            `;

            document.getElementById('content').innerHTML = html;
        }

        function formatTime(isoString) {
            const date = new Date(isoString);
            return date.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: true });
        }

        function formatBlockType(type) {
            return type
                .replace(/_/g, ' ')
                .split(' ')
                .map(word => word.charAt(0).toUpperCase() + word.slice(1))
                .join(' ');
        }

        function getEnergyLevel(readiness) {
            if (readiness >= 85) return '🔥 High';
            if (readiness >= 70) return '✅ Normal';
            if (readiness >= 50) return '⚠️ Recovery';
            return '🛑 Low';
        }

        function getScheduleLevel(readiness) {
            if (readiness >= 85) return 'High Energy';
            if (readiness >= 70) return 'Normal';
            return 'Recovery';
        }

        function getChronotypeMoji(chronotype) {
            const emojiMap = {
                'early': '🐓',
                'moderate': '🌤️',
                'late': '🦉'
            };
            return emojiMap[chronotype] || '🕐';
        }

        // Load dashboard on page load
        window.addEventListener('load', loadDashboard);
    </script>
</body>
</html>
